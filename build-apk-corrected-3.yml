name: Build Mawaqeet Al Mukalla APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project archive
        shell: bash
        run: |
          archive=$(find . -maxdepth 1 -type f \( -name '*v2_fixed.zip' -o -name '*v2_ready.zip' -o -name '*v2.zip' \) | sort | head -n 1)
          if [ -z "$archive" ]; then
            echo 'Project ZIP not found in repository root.'
            exit 1
          fi
          mkdir -p android-project
          unzip -q "$archive" -d android-project
          if [ ! -f android-project/settings.gradle.kts ]; then
            echo 'settings.gradle.kts not found at extracted project root.'
            find android-project -maxdepth 3 -type f | head -80
            exit 1
          fi

      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: test -s android-project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mawaqeet-AlMukalla-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
