name: Build Mawaqeet Al Mukalla APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Mawaqeet_AlMukalla_android_release_candidate.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract the corrected Android project
        run: |
          mkdir -p android-project
          unzip -q Mawaqeet_AlMukalla_android_release_candidate.zip -d android-project
          test -s android-project/settings.gradle.kts
          test -s android-project/app/build.gradle.kts

      - name: Build debug APK
        working-directory: android-project
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        run: test -s android-project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mawaqeet-AlMukalla-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
